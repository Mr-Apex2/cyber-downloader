<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-X | Rotating Neon Downloader</title>
    <style>
        :root {
            --neon-red: #ff0055;
            --neon-glow: rgba(255, 0, 85, 0.4);
            --bg-dark: #050508;
            --card-bg: rgba(10, 10, 15, 0.75);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 0, 85, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.08) 0%, transparent 40%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .glow-wrap {
            position: relative;
            width: 100%;
            max-width: 520px;
            border-radius: 22px;
            padding: 2px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.2);
        }

        @keyframes rotateLight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .glow-wrap::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent,
                transparent,
                transparent,
                var(--neon-red)
            );
            animation: rotateLight 4s linear infinite;
        }

        .container {
            position: relative;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            z-index: 1;
            border: 1px solid rgba(255, 0, 85, 0.2);
        }

        h1 {
            margin-bottom: 5px;
            font-size: 25px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            text-shadow: 0 0 10px var(--neon-red), 0 0 20px var(--neon-red);
        }

        p.subtitle {
            color: #a0a0b8;
            font-size: 13px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #ff77a9;
            font-weight: 600;
        }

        input[type="text"], select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 10px;
            background: rgba(5, 5, 8, 0.85);
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--neon-red);
            box-shadow: 0 0 12px var(--neon-glow);
        }

        input::placeholder { color: #555568; }
        select option { background: #0c0c12; color: #fff; }

        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 0, 85, 0.3);
            border-radius: 10px;
            color: #a0a0b8;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.5px;
        }

        .type-btn.active {
            background: linear-gradient(135deg, #ff0055, #cc0044);
            color: #fff;
            border-color: var(--neon-red);
            box-shadow: 0 0 12px var(--neon-glow);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            background: rgba(255, 0, 85, 0.03);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px dashed rgba(255, 0, 85, 0.2);
            text-align: left;
        }

        .checkbox-group input {
            accent-color: var(--neon-red);
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
        }

        #downloadBtn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0055, #cc0044);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-glow);
            transition: 0.3s;
        }

        #downloadBtn:hover {
            background: linear-gradient(135deg, #ff1a66, #e6004c);
            box-shadow: 0 0 25px var(--neon-red);
            transform: translateY(-2px);
        }

        #downloadBtn:disabled {
            background: #222;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #progressContainer {
            display: none;
            margin-top: 25px;
            text-align: left;
        }

        .progress-bar-bg {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            height: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 0, 85, 0.3);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0055, #ff5588);
            box-shadow: 0 0 10px var(--neon-red);
            transition: width 0.3s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0a0b8;
            margin-top: 8px;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
        }

        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: #00ff88;
            color: #050508;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #1aff99;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.7);
        }
    
        /* ===== Christmas night theme (added) ===== */
        body {
            background: linear-gradient(180deg, #040a1c 0%, #0a1838 45%, #15294f 100%) fixed;
            padding: 20px 14px;
            box-sizing: border-box;
        }
        .glow-wrap { z-index: 3; }
        .container { background: rgba(8, 8, 16, 0.72); }

        .xmas-scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .xmas-moon {
            position: absolute; top: -18vh; left: 50%; width: 90vmax; height: 60vmax;
            transform: translateX(-50%);
            background: radial-gradient(ellipse at center, rgba(120, 160, 255, 0.20) 0%, rgba(120, 160, 255, 0) 60%);
        }
        .xmas-ground { position: absolute; left: 0; bottom: 0; width: 100%; height: 22vh; min-height: 120px; }
        .xmas-tree {
            position: absolute; left: 2vw; bottom: 12vh; height: min(76vh, 620px); width: auto;
            filter: drop-shadow(0 0 18px rgba(255, 190, 80, 0.18));
        }
        .xmas-man {
            position: absolute; right: 3vw; bottom: 10.5vh; height: min(44vh, 390px); width: auto;
            filter: drop-shadow(0 0 14px rgba(150, 190, 255, 0.25));
        }
        .xmas-tree .lt { animation: twinkle 2.4s ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        #snowCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        @media (max-width: 900px) {
            .xmas-tree { left: -9vw; bottom: 9vh; height: 50vh; opacity: 0.9; }
            .xmas-man  { right: -6vw; bottom: 8vh; height: 29vh; opacity: 0.9; }
        }
        @media (prefers-reduced-motion: reduce) {
            .xmas-tree .lt { animation: none; }
        }
    </style>
</head>

<defs>

</div>
<canvas id="snowCanvas" aria-hidden="true"></canvas>


<div class="glow-wrap">
    <div class="container">
        <h1>CYBER X Downloader</h1>
        <p class="subtitle">Advanced Social Media & Playlist Downloader</p>

        <div class="input-group">
            <label>Media / Playlist URL</label>
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." required>
        </div>

        <div class="input-group">
            <label>Select Media Type</label>
            <div class="type-selector">
                <button type="button" class="type-btn active" id="videoBtn" onclick="setMediaType('video')">📹 Video</button>
                <button type="button" class="type-btn" id="audioBtn" onclick="setMediaType('audio')">🎵 Audio Only</button>
            </div>
        </div>

        <div class="input-group" id="videoFormatGroup">
            <label>Video Quality / Format</label>
            <select id="videoFormatSelect">
                <option value="best">Best Quality (Auto)</option>
                <option value="2160">4K Ultra HD (2160p)</option>
                <option value="1440">2K Quad HD (1440p)</option>
                <option value="1080">Full HD (1080p)</option>
                <option value="720">HD (720p)</option>
                <option value="480">SD (480p)</option>
            </select>
        </div>

        <div class="input-group" id="audioFormatGroup" style="display: none;">
            <label>Audio Format / Quality</label>
            <select id="audioFormatSelect">
                <option value="mp3">MP3 (High Quality - 320kbps)</option>
                <option value="m4a">M4A (Apple Compatible)</option>
                <option value="wav">WAV (Lossless / Uncompressed)</option>
                <option value="flac">FLAC (Studio Quality Lossless)</option>
            </select>
        </div>

        <div class="checkbox-group" onclick="document.getElementById('playlistCheck').click()">
            <input type="checkbox" id="playlistCheck" onclick="event.stopPropagation()">
            <label for="playlistCheck" style="margin-bottom:0; cursor:pointer;">Download as full Playlist (Get ZIP archive)</label>
        </div>

        <button id="downloadBtn" onclick="startDownload()">Download Now</button>

        <div id="progressContainer">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-info">
                <span id="progressText">Downloading: 0%</span>
                <span id="speedEtaText">Speed: 0 KB/s</span>
            </div>
        </div>

        <div id="status"></div>
    </div>
</div>

<script>
    let currentMediaType = 'video';

    function setMediaType(type) {
        currentMediaType = type;
        const videoBtn = document.getElementById('videoBtn');
        const audioBtn = document.getElementById('audioBtn');
        const videoGroup = document.getElementById('videoFormatGroup');
        const audioGroup = document.getElementById('audioFormatGroup');

        if (type === 'video') {
            videoBtn.classList.add('active');
            audioBtn.classList.remove('active');
            videoGroup.style.display = 'block';
            audioGroup.style.display = 'none';
        } else {
            audioBtn.classList.add('active');
            videoBtn.classList.remove('active');
            videoGroup.style.display = 'none';
            audioGroup.style.display = 'block';
        }
    }

    async function startDownload() {
        const url = document.getElementById('urlInput').value.trim();
        const format = currentMediaType === 'audio' 
            ? document.getElementById('audioFormatSelect').value 
            : document.getElementById('videoFormatSelect').value;
        const isPlaylist = document.getElementById('playlistCheck').checked;
        
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('downloadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressText = document.getElementById('progressText');
        const speedEtaText = document.getElementById('speedEtaText');

        if (!url) {
            statusDiv.innerHTML = '<span style="color:#ff4757;">Please enter a valid URL!</span>';
            return;
        }

        btn.disabled = true;
        btn.innerText = 'PROCESSING...';
        statusDiv.innerHTML = '';
        progressContainer.style.display = 'block';
        progressBarFill.style.width = '0%';
        progressText.innerText = 'Connecting... 0%';

        try {
            const response = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url, media_type: currentMediaType, format: format, is_playlist: isPlaylist })
            });

            const data = await response.json();

            if (!response.ok || data.error) {
                statusDiv.innerHTML = `<span style="color:#ff4757;">${data.error || 'An error occurred.'}</span>`;
                btn.disabled = false;
                btn.innerText = 'Download Now';
                progressContainer.style.display = 'none';
                return;
            }

            const jobId = data.job_id;
            const eventSource = new EventSource(`/api/progress/${jobId}`);

            eventSource.onmessage = function(event) {
                const res = JSON.parse(event.data);

                if (res.status === 'downloading') {
                    const percent = res.progress || 0;
                    progressBarFill.style.width = percent + '%';
                    progressText.innerText = `Downloading: ${percent.toFixed(1)}%`;
                    speedEtaText.innerText = `Speed: ${res.speed || 'N/A'} | ETA: ${res.eta || 'N/A'}`;
                } else if (res.status === 'processing') {
                    progressBarFill.style.width = '100%';
                    progressText.innerText = 'Processing & Merging Files...';
                    speedEtaText.innerText = 'Almost done!';
                } else if (res.status === 'completed') {
                    eventSource.close();
                    progressContainer.style.display = 'none';
                    btn.disabled = false;
                    btn.innerText = 'Download Now';
                    statusDiv.innerHTML = `
                        <div style="color:#00ff88; font-weight:bold; text-shadow: 0 0 8px rgba(0,255,136,0.5);">Download Ready!</div>
                        <a href="${res.download_url}" class="download-btn" download>💾 Save File (${res.filename})</a>
                    `;
                } else if (res.status === 'error') {
                    eventSource.close();
                    progressContainer.style.display = 'none';
                    btn.disabled = false;
                    btn.innerText = 'Download Now';
                    statusDiv.innerHTML = `<span style="color:#ff4757;">Error: ${res.error}</span>`;
                }
            };

            eventSource.onerror = function() {
                eventSource.close();
                btn.disabled = false;
                btn.innerText = 'Download Now';
                progressContainer.style.display = 'none';
                statusDiv.innerHTML = '<span style="color:#ff4757;">Connection lost.</span>';
            };

        } catch (err) {
            btn.disabled = false;
            btn.innerText = 'Download Now';
            progressContainer.style.display = 'none';
            statusDiv.innerHTML = `<span style="color:#ff4757;">Server connection error.</span>`;
        }
    }
</script>




<script>
/* Falling snow (added) */
(function () {
    var c = document.getElementById('snowCanvas');
    if (!c || !c.getContext) return;
    var ctx = c.getContext('2d'), W = 0, H = 0, flakes = [];
    var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function make(init) {
        var big = Math.random() < 0.12;
        return {
            x: Math.random() * W, y: init ? Math.random() * H : -12,
            r: big ? 3 + Math.random() * 4 : 0.8 + Math.random() * 2,
            s: big ? 0.35 + Math.random() * 0.4 : 0.5 + Math.random() * 1.2,
            d: Math.random() * Math.PI * 2, w: 0.3 + Math.random() * 0.8,
            a: big ? 0.3 : 0.55 + Math.random() * 0.45, big: big
        };
    }
    function resize() {
        W = c.width = window.innerWidth; H = c.height = window.innerHeight;
        var n = Math.min(190, Math.round(W * H / 9000));
        flakes = []; for (var i = 0; i < n; i++) flakes.push(make(true));
    }
    function draw() {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < flakes.length; i++) {
            var f = flakes[i];
            ctx.beginPath();
            ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')';
            ctx.shadowBlur = f.big ? 10 : 0;
            ctx.shadowColor = 'rgba(255,255,255,0.7)';
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();
            if (!still) {
                f.d += 0.01; f.x += Math.sin(f.d) * f.w; f.y += f.s;
                if (f.y > H + 12 || f.x < -20 || f.x > W + 20) { flakes[i] = make(false); }
            }
        }
        if (!still) requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize);
    resize(); draw();
})();
</script>
